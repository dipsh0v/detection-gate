# detection-gate lab: Elasticsearch to ask schema questions of, plus a container to
# run the tool itself so no particular Python version is required on the host.
#
# This is a lab, not a production pattern. Security is off so the checker can
# connect without credentials while you are developing and rehearsing, and the
# port is bound to localhost only. Do not expose it further.
#
#   docker compose up -d
#   curl "localhost:9200/_cluster/health?pretty"
#
# Memory: Elasticsearch wants headroom. If the container exits immediately,
# raise Docker Desktop's memory limit to at least 4 GB.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: detection-gate-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # Runs detection-gate itself. pySigma needs Python 3.10 or newer, which many hosts
  # do not have, so the tool runs here instead of on the host. The repository is
  # mounted at /work, so edits on the host take effect immediately.
  detection-gate:
    image: python:3.12-slim
    container_name: detection-gate-cli
    depends_on:
      elasticsearch:
        condition: service_healthy
    working_dir: /work
    volumes:
      - ..:/work
      - pip-cache:/root/.cache/pip
    environment:
      - DETECTION_GATE_ES_URL=http://elasticsearch:9200
    entrypoint: ["sleep", "infinity"]

volumes:
  es-data:
  pip-cache:
